<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <style>
    .line { fill: none; stroke: #333; stroke-width: 2; stroke-linecap: round; }
    .diaper { fill: #ddd; stroke: #999; }
  </style>
  <!-- Baby lying down -->
  <circle cx="100" cy="40" r="15" class="line"/>
  <path d="M100 55 L100 85" class="line"/>
  <path d="M100 65 L85 55" class="line"/>
  <path d="M100 65 L115 55" class="line"/>
  <path d="M100 85 L90 110" class="line"/>
  <path d="M100 85 L110 110" class="line"/>
  <!-- Changing table -->
  <rect x="70" y="110" width="60" height="10" class="line"/>
  <line x1="75" y1="120" x2="75" y2="140" class="line"/>
  <line x1="125" y1="120" x2="125" y2="140" class="line"/>
  <!-- Diaper -->
  <rect x="85" y="82" width="30" height="15" rx="3" class="diaper"/>
  <path d="M85 85 L82 82" class="line"/>
  <path d="M115 85 L118 82" class="line"/>
  <!-- Wipes container -->
  <rect x="130" y="95" width="15" height="20" rx="2" class="line"/>
  <line x1="130" y1="100" x2="145" y2="100" class="line"/>
  <!-- Pacifier -->
  <circle cx="55" cy="60" r="8" class="line"/>
  <rect x="53" y="68" width="4" height="10" class="line"/>
</svg>